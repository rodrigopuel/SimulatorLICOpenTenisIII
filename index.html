<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simulador — III LIC Open de Tênis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#0a3d20;color:#fff;min-height:100vh}

header{background:#062615;padding:14px 16px;text-align:center;border-bottom:3px solid #27ae60}
header h1{font-size:1.05em;color:#27ae60;font-weight:700;line-height:1.3}
header p{font-size:0.72em;color:#8bc4a0;margin-top:4px}

.qual-section{background:#04180d;border-bottom:2px solid #27ae60;padding:14px 16px}
.qual-section h2{font-size:0.7em;text-transform:uppercase;letter-spacing:2px;color:#f39c12;margin-bottom:10px;text-align:center}
.qual-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.qual-item{min-width:145px;flex:1;max-width:180px;text-align:center}
.qual-label{font-size:0.65em;color:#f39c12;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}

.bracket-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:16px 12px}
.bracket-wrap::-webkit-scrollbar{height:4px}
.bracket-wrap::-webkit-scrollbar-thumb{background:#27ae60;border-radius:2px}
.bracket{display:flex;gap:5px;align-items:stretch;min-width:700px}

.round{display:flex;flex-direction:column;flex:1;min-width:148px;max-width:210px}
.round-label{text-align:center;font-size:0.68em;font-weight:700;color:#27ae60;text-transform:uppercase;
  letter-spacing:1px;padding:5px;background:#04180d;border-radius:4px;margin-bottom:6px}
.round-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:6px}

.match-card{border:1px solid #1e7a40;border-radius:7px;overflow:hidden;background:#0d5c38}
.pbt{
  width:100%;padding:10px 9px;background:none;border:none;color:#eee;
  cursor:pointer;display:flex;align-items:center;gap:6px;font-size:0.8em;
  text-align:left;border-bottom:1px solid #155e2e;line-height:1.3;
  -webkit-tap-highlight-color:rgba(39,174,96,0.3);touch-action:manipulation;min-height:42px
}
.pbt:last-child{border-bottom:none}
.pbt:active{background:#1a7a4e}
.pbt-winner{background:#27ae60!important;color:#fff!important;font-weight:700}
.pbt-loser{opacity:.3}
.pbt-tbd{color:#4a7a5a;font-style:italic;cursor:default}

.seed{background:#f39c12;color:#000;border-radius:3px;padding:1px 5px;
  font-size:0.7em;font-weight:700;min-width:18px;text-align:center;flex-shrink:0}

.round-connector{display:flex;flex-direction:column;justify-content:space-around;
  width:14px;min-width:14px;flex-shrink:0}
.conn-pair{display:flex;flex-direction:column;flex:1}
.conn-top{flex:1;border-right:2px solid #1e5e35;border-bottom:2px solid #1e5e35;border-radius:0 0 4px 0}
.conn-bot{flex:1;border-right:2px solid #1e5e35;border-top:2px solid #1e5e35;border-radius:0 4px 0 0}

.champion{text-align:center;padding:28px 20px}
.champion .icon{font-size:2.5em}
.champion .lbl{font-size:0.72em;text-transform:uppercase;letter-spacing:2px;color:#8bc4a0;margin-top:6px}
.champion .name{font-size:1.3em;font-weight:700;color:#f39c12;margin:8px 0 4px}
.champion .sub{font-size:0.8em;color:#f39c12}

.reset-btn{display:block;margin:8px auto 28px;padding:10px 32px;
  background:#e74c3c;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.9em;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>
</head>
<body>
<header>
  <h1>🎾 III LIC OPEN DE TÊNIS — FLORIANÓPOLIS</h1>
  <p>PRINCIPIANTE · MASCULINO SIMPLES ACIMA 34 ANOS · Lagoa Iate Clube</p>
</header>
<div id="app"></div>

<script>
(function(){

var P = {
  ramon:       {s:'Ramon Junckes',      seed:1},
  thyago:      {s:'Thyago Affonso',     seed:0},
  fabio:       {s:'Fabio Feyh',         seed:0},
  tiago:       {s:'Tiago Salles',       seed:0},
  deivty:      {s:'Deivty Carvalho',    seed:6},
  vitor:       {s:'Vitor Cruz',         seed:3},
  pedro:       {s:'Pedro Luz',          seed:0},
  gustavo:     {s:'Gustavo Corbett',    seed:0},
  rodrigoPuel: {s:'Rodrigo Puel',       seed:0},
  diogo:       {s:'Diogo Rosa',         seed:8},
  laurence:    {s:'Laurence Molinette', seed:7},
  leonel:      {s:'Leonel Wiethorn',    seed:0},
  anderson:    {s:'Anderson Braga',     seed:0},
  daniel:      {s:'Daniel Salgueiro',   seed:0},
  rodrigoL:    {s:'Rodrigo Lemos',      seed:0},
  junior:      {s:'Junior Cavichioli',  seed:4},
  rodrigoS:    {s:'Rodrigo Silveira',   seed:5},
  davi:        {s:'Davi Braz',          seed:0},
  rafael:      {s:'Rafael Cansian',     seed:0},
  christian:   {s:'Christian Emerich',  seed:0},
  jackson:     {s:'Jackson Pereira',    seed:2},
};

var FULL = {
  ramon:'Ramon Junckes Da Silva', thyago:'Thyago Affonso De Souza',
  fabio:'Fabio Henrique Feyh', tiago:'Tiago Salles Freitas',
  deivty:'Deivty Luiz De Carvalho', vitor:'Vitor Bianchi Cruz',
  pedro:'Pedro Alexandre Da Luz', gustavo:'Gustavo Corbett De Bonis',
  rodrigoPuel:'Rodrigo De Oliveira Puel', diogo:'Diogo Jesus Da Rosa',
  laurence:'Laurence Molinette', leonel:'Leonel Luchi Wiethorn',
  anderson:'Anderson Martins Braga', daniel:'Daniel Menegueti Salgueiro',
  rodrigoL:'Rodrigo De Lemos Silva', junior:'Jose Luiz Cavichioli Junior',
  rodrigoS:'Rodrigo Silvio Da Silveira', davi:'Davi Rios Braz',
  rafael:'Rafael Cansian', christian:'Christian Emerich',
  jackson:'Jackson Pereira Da Silva',
};

var DS = {
  q1:['r2'],q2:['r4'],q3:['r5'],q4:['r6'],q5:['r7'],
  r1:['qf1'],r2:['qf1'],r3:['qf2'],r4:['qf2'],
  r5:['qf3'],r6:['qf3'],r7:['qf4'],r8:['qf4'],
  qf1:['sf1'],qf2:['sf1'],qf3:['sf2'],qf4:['sf2'],
  sf1:['f'],sf2:['f'],
};

var S = {};

function init(){
  S = {
    q1:{p1:'fabio',     p2:'tiago',      w:null},
    q2:{p1:'gustavo',   p2:'rodrigoPuel',w:null},
    q3:{p1:'leonel',    p2:'anderson',   w:null},
    q4:{p1:'daniel',    p2:'rodrigoL',   w:null},
    q5:{p1:'davi',      p2:'rafael',     w:null},
    r1:{p1:'ramon',     p2:'thyago',     w:null},
    r2:{p1:'q1',        p2:'deivty',     w:null},
    r3:{p1:'vitor',     p2:'pedro',      w:null},
    r4:{p1:'q2',        p2:'diogo',      w:null},
    r5:{p1:'laurence',  p2:'q3',         w:null},
    r6:{p1:'q4',        p2:'junior',     w:null},
    r7:{p1:'rodrigoS',  p2:'q5',         w:null},
    r8:{p1:'christian', p2:'jackson',    w:null},
    qf1:{p1:'r1', p2:'r2', w:null},
    qf2:{p1:'r3', p2:'r4', w:null},
    qf3:{p1:'r5', p2:'r6', w:null},
    qf4:{p1:'r7', p2:'r8', w:null},
    sf1:{p1:'qf1',p2:'qf2',w:null},
    sf2:{p1:'qf3',p2:'qf4',w:null},
    f:  {p1:'sf1',p2:'sf2',w:null},
  };
}

function resolve(slot){
  if(P[slot]) return slot;
  var m = S[slot];
  return m ? m.w : null;
}

function clearDS(id){
  var deps = DS[id]||[];
  for(var i=0;i<deps.length;i++){
    S[deps[i]].w = null;
    clearDS(deps[i]);
  }
}

function pick(matchId, pKey){
  if(S[matchId].w === pKey) return;
  S[matchId].w = pKey;
  clearDS(matchId);
  render();
}

function btn(mid, slot){
  var pKey = resolve(slot);
  var m = S[mid];
  if(!pKey){
    return '<button class="pbt pbt-tbd" disabled>A definir…</button>';
  }
  var p = P[pKey];
  var isW = m.w === pKey;
  var isL = m.w && m.w !== pKey;
  var cls = 'pbt';
  if(isW) cls += ' pbt-winner';
  if(isL) cls += ' pbt-loser';
  var badge = p.seed ? '<span class="seed">'+p.seed+'</span>' : '';
  return '<button class="'+cls+'" data-mid="'+mid+'" data-pkey="'+pKey+'">'+badge+'<span>'+p.s+'</span></button>';
}

function card(id){
  var m = S[id];
  return '<div class="match-card">'+btn(id,m.p1)+btn(id,m.p2)+'</div>';
}

function conn(n){
  var h='<div class="round-connector">';
  for(var i=0;i<n;i++) h+='<div class="conn-pair"><div class="conn-top"></div><div class="conn-bot"></div></div>';
  return h+'</div>';
}

function render(){
  var champ = S.f.w;
  var html = '';

  // Classificatórios
  html += '<div class="qual-section">';
  html += '<h2>🎾 Classificatórios — Lagoa Iate Clube</h2>';
  html += '<div class="qual-grid">';
  var qs = ['q1','q2','q3','q4','q5'];
  for(var i=0;i<qs.length;i++){
    html += '<div class="qual-item"><div class="qual-label">Q'+(i+1)+'</div>'+card(qs[i])+'</div>';
  }
  html += '</div></div>';

  // Bracket
  html += '<div class="bracket-wrap"><div class="bracket">';

  // Oitavas
  html += '<div class="round"><div class="round-label">Oitavas de Final</div><div class="round-matches">';
  var r16 = ['r1','r2','r3','r4','r5','r6','r7','r8'];
  for(var j=0;j<r16.length;j++) html += card(r16[j]);
  html += '</div></div>';

  html += conn(4);

  html += '<div class="round"><div class="round-label">Quartas de Final</div><div class="round-matches">';
  var qf = ['qf1','qf2','qf3','qf4'];
  for(var k=0;k<qf.length;k++) html += card(qf[k]);
  html += '</div></div>';

  html += conn(2);

  html += '<div class="round"><div class="round-label">Semifinal</div><div class="round-matches">';
  html += card('sf1')+card('sf2');
  html += '</div></div>';

  html += conn(1);

  html += '<div class="round"><div class="round-label">Final</div><div class="round-matches">';
  html += card('f');
  html += '</div></div>';

  html += '</div></div>';

  // Campeão
  if(champ){
    var ci = P[champ];
    html += '<div class="champion">';
    html += '<div class="icon">🏆</div>';
    html += '<div class="lbl">Campeão</div>';
    html += '<div class="name">'+FULL[champ]+'</div>';
    if(ci.seed) html += '<div class="sub">Cabeça de Chave #'+ci.seed+'</div>';
    html += '</div>';
  }

  html += '<div style="text-align:center"><button class="reset-btn" id="resetBtn">↺ Reiniciar simulação</button></div>';

  document.getElementById('app').innerHTML = html;
}

// Event delegation — funciona no iOS/Android sem problemas
document.getElementById('app').addEventListener('click', function(e){
  var btn = e.target.closest('[data-mid]');
  if(btn){
    pick(btn.getAttribute('data-mid'), btn.getAttribute('data-pkey'));
    return;
  }
  if(e.target.id === 'resetBtn' || e.target.closest('#resetBtn')){
    init(); render();
  }
});

init();
render();

})();
</script>
</body>
</html>
